3. Botão "Ocultar Imagens" / "Mostrar Imagens"
---------------HTML

Coloca este botão na barra superior (junto aos filtros):

<button id="toggleImagens" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
    Ocultar Imagens
</button>
-----------------------CSS
.ocultar-imagens img {
    display: none;
}

------------------------JS
const btnToggleImagens = document.getElementById('toggleImagens');
if (btnToggleImagens) {
    btnToggleImagens.addEventListener('click', () => {
        document.body.classList.toggle('ocultar-imagens');
        btnToggleImagens.textContent =
            document.body.classList.contains('ocultar-imagens')
                ? 'Mostrar Imagens'
                : 'Ocultar Imagens';
    });
}
